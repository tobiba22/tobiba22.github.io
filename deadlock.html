<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadlock Item Flashcards</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1e2530;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --weapon: #e87d25;
      --vitality: #6aaa1e;
      --spirit: #c27df7;
      --correct: #3fb950;
      --wrong: #f85149;
      --highlight: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text);
      flex: 1;
    }

    header h1 span { color: var(--weapon); }

    .mode-tabs {
      display: flex;
      gap: 6px;
    }

    .mode-tab {
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }

    .mode-tab.active {
      background: var(--highlight);
      border-color: var(--highlight);
      color: #000;
      font-weight: 600;
    }

    /* FILTERS */
    .controls {
      padding: 14px 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .filter-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.15s;
    }

    .filter-btn.active-weapon { background: var(--weapon); border-color: var(--weapon); color: #000; font-weight: 600; }
    .filter-btn.active-vitality { background: var(--vitality); border-color: var(--vitality); color: #000; font-weight: 600; }
    .filter-btn.active-spirit { background: var(--spirit); border-color: var(--spirit); color: #000; font-weight: 600; }
    .filter-btn.active-all { background: var(--highlight); border-color: var(--highlight); color: #000; font-weight: 600; }

    .spacer { flex: 1; }

    .score-bar {
      display: flex;
      gap: 14px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .score-bar span { color: var(--text); font-weight: 600; }

    /* MAIN CONTENT */
    main {
      flex: 1;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* ===== FLASHCARD MODE ===== */
    #flashcard-mode { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 20px; }

    .progress-text { color: var(--muted); font-size: 0.85rem; }

    .card-scene {
      width: 100%;
      height: 340px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 28px;
    }

    .card-face.back {
      transform: rotateY(180deg);
      justify-content: flex-start;
      padding: 24px 28px;
      overflow-y: auto;
    }

    .card-front-category {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .weapon-badge { background: rgba(232,125,37,0.18); color: var(--weapon); }
    .vitality-badge { background: rgba(106,170,30,0.18); color: var(--vitality); }
    .spirit-badge { background: rgba(194,125,247,0.18); color: var(--spirit); }

    .card-item-icon {
      width: 96px;
      height: 96px;
      object-fit: contain;
      image-rendering: auto;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
    }

    .card-item-icon-fallback {
      width: 96px;
      height: 96px;
      border-radius: 12px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
    }

    .card-item-name {
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
    }

    .card-tier {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .flip-hint {
      font-size: 0.75rem;
      color: var(--muted);
      position: absolute;
      bottom: 14px;
    }

    /* Back of card */
    .back-header {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .back-icon {
      width: 44px;
      height: 44px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .back-title { font-size: 1rem; font-weight: 700; }
    .back-subtitle { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    .back-description {
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.6;
      margin-bottom: 14px;
      font-style: italic;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
    }

    .stat-pill {
      background: var(--surface2);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.78rem;
      color: var(--text);
    }

    .stat-pill .stat-label { color: var(--muted); font-size: 0.7rem; display: block; }

    /* Flashcard nav */
    .fc-nav {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .nav-btn {
      padding: 9px 22px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 0.88rem;
      transition: all 0.15s;
    }

    .nav-btn:hover:not(:disabled) { background: var(--surface2); border-color: var(--highlight); }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }

    .nav-btn.primary {
      background: var(--highlight);
      border-color: var(--highlight);
      color: #000;
      font-weight: 600;
    }

    /* ===== QUIZ MODE ===== */
    #quiz-mode { width: 100%; max-width: 700px; display: flex; flex-direction: column; align-items: center; gap: 24px; }

    .quiz-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .quiz-item-icon {
      width: 88px;
      height: 88px;
      object-fit: contain;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.7));
    }

    .quiz-item-name {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
    }

    .quiz-question {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }

    .quiz-options {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    @media (max-width: 520px) {
      .quiz-options { grid-template-columns: 1fr; }
    }

    .quiz-option {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      font-size: 0.83rem;
      color: var(--text);
      line-height: 1.45;
      transition: all 0.15s;
      text-align: left;
    }

    .quiz-option:hover:not(.locked) { border-color: var(--highlight); background: rgba(88,166,255,0.08); }
    .quiz-option.correct { border-color: var(--correct); background: rgba(63,185,80,0.15); color: var(--correct); font-weight: 600; }
    .quiz-option.wrong { border-color: var(--wrong); background: rgba(248,81,73,0.12); color: var(--wrong); }
    .quiz-option.reveal { border-color: var(--correct); background: rgba(63,185,80,0.08); }

    .quiz-feedback {
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 22px;
    }

    .feedback-correct { color: var(--correct); }
    .feedback-wrong { color: var(--wrong); }

    .quiz-progress {
      width: 100%;
      max-width: 700px;
    }

    .progress-bar-track {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--highlight);
      border-radius: 2px;
      transition: width 0.3s;
    }

    /* RESULTS SCREEN */
    #results-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
      max-width: 460px;
      width: 100%;
    }

    .result-score {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
    }

    .result-label { color: var(--muted); font-size: 0.95rem; }

    .result-breakdown {
      display: flex;
      gap: 28px;
    }

    .result-stat { text-align: center; }
    .result-stat .val { font-size: 1.6rem; font-weight: 700; }
    .result-stat .lbl { font-size: 0.75rem; color: var(--muted); }
    .result-stat .val.c { color: var(--correct); }
    .result-stat .val.w { color: var(--wrong); }

    /* CATEGORY COLORS on card border */
    .card-face.weapon-border { border-top: 3px solid var(--weapon); }
    .card-face.vitality-border { border-top: 3px solid var(--vitality); }
    .card-face.spirit-border { border-top: 3px solid var(--spirit); }

    .quiz-card.weapon-border { border-top: 3px solid var(--weapon); }
    .quiz-card.vitality-border { border-top: 3px solid var(--vitality); }
    .quiz-card.spirit-border { border-top: 3px solid var(--spirit); }

    /* ===== MATCHING MODE ===== */
    #matching-mode {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .matching-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .matching-progress-text { color: var(--muted); font-size: 0.85rem; }

    .matching-score {
      font-size: 0.82rem;
      color: var(--muted);
    }
    .matching-score span { color: var(--text); font-weight: 600; }

    .matching-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .matching-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-item-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      min-height: 68px;
    }

    .match-item-card:hover:not(.matched):not(.wrong-flash) {
      border-color: var(--highlight);
      background: rgba(88,166,255,0.06);
    }

    .match-item-card.selected {
      border-color: var(--highlight);
      background: rgba(88,166,255,0.14);
      transform: scale(1.02);
    }

    .match-item-card.matched {
      border-color: var(--correct);
      background: rgba(63,185,80,0.14);
      cursor: default;
      pointer-events: none;
    }

    .match-item-card.wrong-flash {
      border-color: var(--wrong);
      background: rgba(248,81,73,0.14);
      animation: wrongShake 0.35s ease;
    }

    @keyframes wrongShake {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(-6px); }
      40%  { transform: translateX(6px); }
      60%  { transform: translateX(-4px); }
      80%  { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    .match-icon {
      width: 44px;
      height: 44px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }

    .match-item-name {
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .match-item-cat {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .match-desc-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text);
      line-height: 1.5;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      min-height: 68px;
      display: flex;
      align-items: center;
    }

    .match-desc-card:hover:not(.matched):not(.wrong-flash) {
      border-color: var(--highlight);
      background: rgba(88,166,255,0.06);
    }

    .match-desc-card.selected {
      border-color: var(--highlight);
      background: rgba(88,166,255,0.14);
      transform: scale(1.02);
    }

    .match-desc-card.matched {
      border-color: var(--correct);
      background: rgba(63,185,80,0.14);
      cursor: default;
      pointer-events: none;
      color: var(--correct);
      font-weight: 600;
    }

    .match-desc-card.wrong-flash {
      border-color: var(--wrong);
      background: rgba(248,81,73,0.14);
      animation: wrongShake 0.35s ease;
    }

    .matching-complete-banner {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--correct);
      border-radius: 16px;
      width: 100%;
      text-align: center;
    }

    .matching-complete-banner.visible { display: flex; }

    .matching-complete-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--correct);
    }

    .matching-complete-sub {
      font-size: 0.88rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <h1><span>Deadlock</span> Item Flashcards</h1>
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('flashcard')">Flashcards</button>
    <button class="mode-tab" onclick="setMode('quiz')">Quiz</button>
    <button class="mode-tab" onclick="setMode('matching')">Matching</button>
  </div>
</header>

<div class="controls">
  <button class="filter-btn active-all" data-cat="all" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" data-cat="weapon" onclick="setFilter('weapon', this)">Weapon</button>
  <button class="filter-btn" data-cat="vitality" onclick="setFilter('vitality', this)">Vitality</button>
  <button class="filter-btn" data-cat="spirit" onclick="setFilter('spirit', this)">Spirit</button>
  <div class="spacer"></div>
  <div class="score-bar" id="score-bar" style="display:none">
    Correct: <span id="score-correct">0</span> &nbsp;/&nbsp; Wrong: <span id="score-wrong">0</span>
  </div>
</div>

<main>
  <!-- FLASHCARD MODE -->
  <div id="flashcard-mode">
    <div class="progress-text" id="fc-progress">Card 1 of 40</div>
    <div class="card-scene" onclick="flipCard()">
      <div class="card" id="fc-card">
        <div class="card-face front" id="fc-front">
          <!-- populated by JS -->
        </div>
        <div class="card-face back" id="fc-back">
          <!-- populated by JS -->
        </div>
      </div>
    </div>
    <div class="fc-nav">
      <button class="nav-btn" id="fc-prev" onclick="fcNav(-1)">← Prev</button>
      <button class="nav-btn" onclick="shuffleDeck()">Shuffle</button>
      <button class="nav-btn" id="fc-next" onclick="fcNav(1)">Next →</button>
    </div>
  </div>

  <!-- QUIZ MODE -->
  <div id="quiz-mode" style="display:none">
    <div class="quiz-progress">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="quiz-progress-fill" style="width:0%"></div></div>
    </div>
    <div class="quiz-card" id="quiz-card">
      <!-- populated by JS -->
    </div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="nav-btn primary" id="quiz-next-btn" onclick="quizNext()" style="display:none">Next Question →</button>
  </div>

  <!-- MATCHING MODE -->
  <div id="matching-mode" style="display:none">
    <div class="matching-header">
      <div class="matching-progress-text" id="match-progress">Round 1</div>
      <div class="matching-score">Matched: <span id="match-score">0</span> / <span id="match-total">0</span></div>
    </div>
    <div class="matching-grid" id="matching-grid">
      <div class="matching-col" id="match-items-col"></div>
      <div class="matching-col" id="match-descs-col"></div>
    </div>
    <div class="matching-complete-banner" id="match-complete-banner">
      <div class="matching-complete-title">Round Complete!</div>
      <div class="matching-complete-sub" id="match-complete-sub"></div>
      <button class="nav-btn primary" onclick="matchNextRound()">Next Round →</button>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="results-screen">
    <div class="result-score" id="result-pct">—</div>
    <div class="result-label">Quiz Complete!</div>
    <div class="result-breakdown">
      <div class="result-stat"><div class="val c" id="res-correct">0</div><div class="lbl">Correct</div></div>
      <div class="result-stat"><div class="val w" id="res-wrong">0</div><div class="lbl">Wrong</div></div>
    </div>
    <button class="nav-btn primary" onclick="restartQuiz()">Play Again</button>
  </div>
</main>

// ─── State ───────────────────────────────────────────────────────────────────
let currentFilter = 'all';
let currentMode = 'flashcard';
let filteredItems = [...ALL_ITEMS];
let deckOrder = [];
let fcIndex = 0;
let quizQueue = [];
let quizIndex = 0;
let quizCorrect = 0;
let quizWrong = 0;
let quizAnswered = false;

// ─── Utility ─────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function categoryBadge(cat) {
  return `<span class="card-front-category ${cat}-badge">${cat.charAt(0).toUpperCase() + cat.slice(1)}</span>`;
}

function categoryBorderClass(cat) {
  return `${cat}-border`;
}

function imgEl(src, cls, alt) {
  return `<img src="${src}" class="${cls}" alt="${alt}" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='flex')">`;
}

// ─── Filter ───────────────────────────────────────────────────────────────────
function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = 'filter-btn';
  });
  btn.classList.add(`active-${cat}`);

  filteredItems = cat === 'all' ? [...ALL_ITEMS] : ALL_ITEMS.filter(i => i.category === cat);
  deckOrder = shuffle(filteredItems.map((_, i) => i));
  fcIndex = 0;
  quizQueue = shuffle([...filteredItems]);
  quizIndex = 0;
  quizCorrect = 0;
  quizWrong = 0;

  if (currentMode === 'flashcard') {
    renderFlashcard();
  } else if (currentMode === 'quiz') {
    renderQuiz();
  } else if (currentMode === 'matching') {
    matchStart();
  }
}

// ─── Mode ─────────────────────────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach((t, i) => {
    t.classList.toggle('active',
      (i === 0 && mode === 'flashcard') ||
      (i === 1 && mode === 'quiz') ||
      (i === 2 && mode === 'matching')
    );
  });
  document.getElementById('flashcard-mode').style.display = mode === 'flashcard' ? 'flex' : 'none';
  document.getElementById('quiz-mode').style.display = mode === 'quiz' ? 'flex' : 'none';
  document.getElementById('matching-mode').style.display = mode === 'matching' ? 'flex' : 'none';
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('score-bar').style.display = mode === 'quiz' ? 'flex' : 'none';

  if (mode === 'quiz') {
    quizQueue = shuffle([...filteredItems]);
    quizIndex = 0;
    quizCorrect = 0;
    quizWrong = 0;
    updateScoreBar();
    renderQuiz();
  }
  if (mode === 'matching') {
    matchStart();
  }
}

// ─── FLASHCARD LOGIC ──────────────────────────────────────────────────────────
function initDeck() {
  deckOrder = shuffle(filteredItems.map((_, i) => i));
  fcIndex = 0;
  renderFlashcard();
}

function renderFlashcard() {
  const card = document.getElementById('fc-card');
  card.classList.remove('flipped');

  const item = filteredItems[deckOrder[fcIndex]];
  const total = filteredItems.length;

  document.getElementById('fc-progress').textContent = `Card ${fcIndex + 1} of ${total}`;
  document.getElementById('fc-prev').disabled = fcIndex === 0;
  document.getElementById('fc-next').disabled = fcIndex === total - 1;

  const borderCls = categoryBorderClass(item.category);

  // Front
  const front = document.getElementById('fc-front');
  front.className = `card-face front ${borderCls}`;
  front.innerHTML = `
    ${categoryBadge(item.category)}
    <img src="${item.image}" class="card-item-icon" alt="${item.name}"
      onerror="this.style.opacity=0.3">
    <div class="card-item-name">${item.name}</div>
    <div class="card-tier">T${item.tier} · ${item.cost} Souls</div>
    <div class="flip-hint">Click to reveal</div>
  `;

  // Back
  const back = document.getElementById('fc-back');
  back.className = `card-face back ${borderCls}`;

  const statsHtml = item.stats.map(s =>
    `<div class="stat-pill">${s}</div>`
  ).join('');

  back.innerHTML = `
    <div class="back-header">
      <img src="${item.image}" class="back-icon" alt="${item.name}" onerror="this.style.opacity=0.3">
      <div>
        <div class="back-title">${item.name}</div>
        <div class="back-subtitle">${categoryBadge(item.category)} &nbsp; T${item.tier} · ${item.cost} Souls</div>
      </div>
    </div>
    <div class="back-description">"${item.description}"</div>
    <div class="stats-grid">${statsHtml}</div>
  `;
}

function flipCard() {
  document.getElementById('fc-card').classList.toggle('flipped');
}

function fcNav(dir) {
  const newIdx = fcIndex + dir;
  if (newIdx < 0 || newIdx >= filteredItems.length) return;
  fcIndex = newIdx;
  renderFlashcard();
}

function shuffleDeck() {
  deckOrder = shuffle(filteredItems.map((_, i) => i));
  fcIndex = 0;
  renderFlashcard();
}

// ─── QUIZ LOGIC ───────────────────────────────────────────────────────────────
function renderQuiz() {
  document.getElementById('quiz-mode').style.display = 'flex';
  document.getElementById('results-screen').style.display = 'none';

  if (quizIndex >= quizQueue.length) {
    showResults();
    return;
  }

  quizAnswered = false;
  document.getElementById('quiz-feedback').textContent = '';
  document.getElementById('quiz-next-btn').style.display = 'none';

  const item = quizQueue[quizIndex];
  const pct = (quizIndex / quizQueue.length) * 100;
  document.getElementById('quiz-progress-fill').style.width = pct + '%';

  // Build wrong options from other items
  const pool = filteredItems.filter(i => i.name !== item.name);
  const wrongs = shuffle(pool).slice(0, 3);
  const options = shuffle([item, ...wrongs]);

  const borderCls = categoryBorderClass(item.category);

  document.getElementById('quiz-card').className = `quiz-card ${borderCls}`;
  document.getElementById('quiz-card').innerHTML = `
    ${categoryBadge(item.category)}
    <img src="${item.image}" class="quiz-item-icon" alt="${item.name}" onerror="this.style.opacity=0.3">
    <div class="quiz-item-name">${item.name}</div>
    <div class="quiz-question">What does this item do?</div>
    <div class="quiz-options" id="quiz-options">
      ${options.map((opt, i) => `
        <button class="quiz-option" data-correct="${opt.name === item.name}" onclick="selectAnswer(this, '${item.name}')">
          ${opt.description}
        </button>
      `).join('')}
    </div>
  `;
}

function selectAnswer(btn, correctName) {
  if (quizAnswered) return;
  quizAnswered = true;

  const isCorrect = btn.dataset.correct === 'true';
  const fb = document.getElementById('quiz-feedback');
  const opts = document.querySelectorAll('.quiz-option');

  opts.forEach(o => {
    o.classList.add('locked');
    if (o.dataset.correct === 'true') o.classList.add('correct');
  });

  if (isCorrect) {
    btn.classList.add('correct');
    fb.textContent = '✓ Correct!';
    fb.className = 'quiz-feedback feedback-correct';
    quizCorrect++;
  } else {
    btn.classList.add('wrong');
    fb.textContent = '✗ Wrong — the correct answer is highlighted.';
    fb.className = 'quiz-feedback feedback-wrong';
    quizWrong++;
  }

  updateScoreBar();
  document.getElementById('quiz-next-btn').style.display = 'inline-block';
}

function quizNext() {
  quizIndex++;
  renderQuiz();
}

function showResults() {
  document.getElementById('quiz-mode').style.display = 'none';
  document.getElementById('results-screen').style.display = 'flex';
  document.getElementById('score-bar').style.display = 'none';

  const total = quizQueue.length;
  const pct = total > 0 ? Math.round((quizCorrect / total) * 100) : 0;
  const color = pct >= 70 ? 'var(--correct)' : pct >= 40 ? 'var(--weapon)' : 'var(--wrong)';

  document.getElementById('result-pct').textContent = pct + '%';
  document.getElementById('result-pct').style.color = color;
  document.getElementById('res-correct').textContent = quizCorrect;
  document.getElementById('res-wrong').textContent = quizWrong;
}

function restartQuiz() {
  quizQueue = shuffle([...filteredItems]);
  quizIndex = 0;
  quizCorrect = 0;
  quizWrong = 0;
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('quiz-mode').style.display = 'flex';
  document.getElementById('score-bar').style.display = 'flex';
  updateScoreBar();
  renderQuiz();
}

function updateScoreBar() {
  document.getElementById('score-correct').textContent = quizCorrect;
  document.getElementById('score-wrong').textContent = quizWrong;
}

// ─── MATCHING LOGIC ───────────────────────────────────────────────────────────
let matchQueue = [];       // shuffled pool for this session
let matchRoundIndex = 0;   // how many items consumed so far
let matchTotalMatched = 0;
let matchTotalItems = 0;
let matchSelected = null;  // { type: 'item'|'desc', index: number, el: Element }
let matchPairs = [];       // current round's 5 pairs: [{item, desc, itemEl, descEl, matched}]
let matchLocked = false;   // block clicks during wrong-flash animation

function matchStart() {
  matchQueue = shuffle([...filteredItems]);
  matchRoundIndex = 0;
  matchTotalMatched = 0;
  matchTotalItems = matchQueue.length;
  document.getElementById('match-total').textContent = matchTotalItems;
  document.getElementById('match-score').textContent = 0;
  matchLoadRound();
}

function matchLoadRound() {
  matchSelected = null;
  matchLocked = false;
  document.getElementById('match-complete-banner').classList.remove('visible');
  document.getElementById('matching-grid').style.display = 'grid';

  const batch = matchQueue.slice(matchRoundIndex, matchRoundIndex + 5);
  if (batch.length === 0) {
    // All done — show final banner
    document.getElementById('match-complete-banner').classList.add('visible');
    document.getElementById('matching-grid').style.display = 'none';
    document.getElementById('match-complete-sub').textContent = `You matched all ${matchTotalItems} items!`;
    document.querySelector('#match-complete-banner .nav-btn').textContent = 'Play Again';
    document.querySelector('#match-complete-banner .nav-btn').onclick = matchStart;
    return;
  }

  const roundNum = Math.floor(matchRoundIndex / 5) + 1;
  const totalRounds = Math.ceil(matchQueue.length / 5);
  document.getElementById('match-progress').textContent = `Round ${roundNum} of ${totalRounds}`;

  // Build pairs with shuffled descriptions order
  const descOrder = shuffle(batch.map((_, i) => i));
  matchPairs = batch.map((item, i) => ({ item, descIndex: descOrder[i], matched: false }));
  // descIndex maps each item slot to which desc position shows its description
  // We need: left col = items in order 0-4, right col = descriptions shuffled
  // Build desc slots: slot[descOrder[i]] = item i
  const descSlots = new Array(batch.length);
  matchPairs.forEach((pair, i) => { descSlots[pair.descIndex] = i; });

  const itemsCol = document.getElementById('match-items-col');
  const descsCol = document.getElementById('match-descs-col');
  itemsCol.innerHTML = '';
  descsCol.innerHTML = '';

  // Render item cards (left)
  batch.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'match-item-card';
    card.dataset.pairIndex = i;
    card.innerHTML = `
      <img src="${item.image}" class="match-icon" alt="${item.name}" onerror="this.style.opacity=0.3">
      <div>
        <div class="match-item-name">${item.name}</div>
        <div class="match-item-cat">${item.category} · T${item.tier} · ${item.cost} Souls</div>
      </div>`;
    card.addEventListener('click', () => matchClickItem(i, card));
    itemsCol.appendChild(card);
  });

  // Render description cards (right) — in shuffled order
  descSlots.forEach((pairIndex, slot) => {
    const card = document.createElement('div');
    card.className = 'match-desc-card';
    card.dataset.pairIndex = pairIndex;
    card.dataset.slot = slot;
    card.textContent = batch[pairIndex].description;
    card.addEventListener('click', () => matchClickDesc(pairIndex, card));
    descsCol.appendChild(card);
  });
}

function matchClickItem(pairIndex, el) {
  if (matchLocked) return;
  const pair = matchPairs[pairIndex];
  if (pair.matched) return;

  // If clicking already-selected item, deselect
  if (matchSelected && matchSelected.type === 'item' && matchSelected.index === pairIndex) {
    el.classList.remove('selected');
    matchSelected = null;
    return;
  }

  // Deselect any previously selected item
  document.querySelectorAll('.match-item-card.selected').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');

  if (matchSelected && matchSelected.type === 'desc') {
    // We have a desc selected — attempt match
    matchAttempt(pairIndex, matchSelected.index, el, matchSelected.el);
  } else {
    matchSelected = { type: 'item', index: pairIndex, el };
  }
}

function matchClickDesc(pairIndex, el) {
  if (matchLocked) return;
  const pair = matchPairs[pairIndex];
  if (pair.matched) return;

  // If clicking already-selected desc, deselect
  if (matchSelected && matchSelected.type === 'desc' && matchSelected.index === pairIndex) {
    el.classList.remove('selected');
    matchSelected = null;
    return;
  }

  // Deselect any previously selected desc
  document.querySelectorAll('.match-desc-card.selected').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');

  if (matchSelected && matchSelected.type === 'item') {
    // We have an item selected — attempt match
    matchAttempt(matchSelected.index, pairIndex, matchSelected.el, el);
  } else {
    matchSelected = { type: 'desc', index: pairIndex, el };
  }
}

function matchAttempt(itemPairIndex, descPairIndex, itemEl, descEl) {
  matchSelected = null;

  if (itemPairIndex === descPairIndex) {
    // Correct!
    itemEl.classList.remove('selected');
    descEl.classList.remove('selected');
    itemEl.classList.add('matched');
    descEl.classList.add('matched');
    matchPairs[itemPairIndex].matched = true;
    matchTotalMatched++;
    document.getElementById('match-score').textContent = matchTotalMatched;

    // Check if round is complete
    if (matchPairs.every(p => p.matched)) {
      matchRoundIndex += 5;
      setTimeout(() => {
        const remaining = matchQueue.length - matchRoundIndex;
        if (remaining <= 0) {
          document.getElementById('match-complete-banner').classList.add('visible');
          document.getElementById('matching-grid').style.display = 'none';
          document.getElementById('match-complete-sub').textContent = `You matched all ${matchTotalItems} items!`;
          document.querySelector('#match-complete-banner .nav-btn').textContent = 'Play Again';
          document.querySelector('#match-complete-banner .nav-btn').onclick = matchStart;
        } else {
          document.getElementById('match-complete-sub').textContent =
            `${remaining} item${remaining !== 1 ? 's' : ''} remaining`;
          document.getElementById('match-complete-banner').classList.add('visible');
          document.getElementById('matching-grid').style.display = 'none';
        }
      }, 400);
    }
  } else {
    // Wrong — flash both red then reset
    matchLocked = true;
    itemEl.classList.remove('selected');
    descEl.classList.remove('selected');
    itemEl.classList.add('wrong-flash');
    descEl.classList.add('wrong-flash');
    setTimeout(() => {
      itemEl.classList.remove('wrong-flash');
      descEl.classList.remove('wrong-flash');
      matchLocked = false;
    }, 400);
  }
}

function matchNextRound() {
  document.getElementById('match-complete-banner').classList.remove('visible');
  document.getElementById('matching-grid').style.display = 'grid';
  matchLoadRound();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
filteredItems = [...ALL_ITEMS];
initDeck();
</script>
