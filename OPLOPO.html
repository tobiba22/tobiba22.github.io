<title>OPLOPO Film Library</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #000000;
    font-family: 'Times New Roman', Times, serif;
    font-size: 16px;
    line-height: 1.5;
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  }
  a { color: #0000ee; }
  a:visited { color: #551a8b; }
  a:hover { color: #ee0000; }

  .page-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 16px 60px;
  }

  h1 {
    font-size: 24px;
    font-weight: bold;
    margin: 0 0 4px;
    border-bottom: 3px double #000;
    padding-bottom: 6px;
  }
  .subtitle {
    font-size: 14px;
    color: #555;
    margin-bottom: 16px;
  }

  /* nav */
  .country-nav {
    background: #eef;
    border: 1px solid #aaa;
    padding: 6px 10px;
    margin-bottom: 20px;
    font-size: 13px;
    line-height: 2;
  }
  .country-nav b {
    display: block;
    margin-bottom: 2px;
  }
  .country-nav a {
    margin-right: 6px;
    white-space: nowrap;
  }

  /* search */
  .search-wrap {
    margin-bottom: 20px;
  }
  .search-wrap label {
    font-weight: bold;
    margin-right: 6px;
  }
  #search {
    font-family: 'Times New Roman', Times, serif;
    font-size: 15px;
    border: 1px solid #888;
    padding: 3px 6px;
    width: 280px;
  }
  #search-count {
    font-size: 13px;
    color: #555;
    margin-left: 8px;
  }
  #no-results {
    color: #cc0000;
    display: none;
    margin-bottom: 16px;
  }

  /* sections */
  .section {
    margin-bottom: 32px;
    scroll-margin-top: 10px;
  }
  .section-header {
    background: #000080;
    color: #ffffff;
    padding: 4px 10px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
  }
  .section-country {
    font-size: 17px;
    font-weight: bold;
  }
  .section-count {
    font-size: 12px;
    opacity: 0.85;
  }

  /* director groups */
  .director-name {
    font-weight: bold;
    font-style: italic;
    font-size: 15px;
    border-bottom: 1px solid #ccc;
    margin: 14px 0 4px;
    padding-bottom: 2px;
  }
  .director-group:first-child .director-name { margin-top: 0; }

  /* film table */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  tr:nth-child(even) { background: #f0f0f8; }
  td {
    padding: 3px 8px;
    vertical-align: top;
  }
  td.film-year {
    white-space: nowrap;
    color: #333;
    width: 46px;
    font-variant-numeric: tabular-nums;
  }
  td.film-director {
    color: #555;
    font-style: italic;
    width: 160px;
  }
  td.film-title { }

  hr { border: none; border-top: 1px solid #ccc; margin: 24px 0; }

  #lock-screen {
    max-width: 320px;
    margin: 15vh auto 0;
    padding: 20px;
    text-align: center;
  }
  #lock-screen h2 {
    font-size: 18px;
    margin-bottom: 12px;
  }
  #lock-screen input {
    font-family: 'Times New Roman', Times, serif;
    font-size: 15px;
    border: 1px solid #888;
    padding: 5px 8px;
    width: 100%;
    margin-bottom: 10px;
    box-sizing: border-box;
  }
  #lock-screen button {
    font-family: 'Times New Roman', Times, serif;
    font-size: 14px;
    padding: 5px 14px;
    cursor: pointer;
  }
  #lock-error {
    color: #cc0000;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
</style>

<div id="lock-screen">
  <h2>This page is password protected</h2>
  <input type="password" id="lock-password" placeholder="Password" autocomplete="off">
  <button id="lock-submit">Enter</button>
  <div id="lock-error">Incorrect password.</div>
</div>

<div class="page-wrap" id="page-wrap" style="display:none">
  <h1>OPLOPO Film Library</h1>
  <div class="subtitle" id="subtitle"></div>

  <div class="country-nav">
    <b>Jump to:</b>
    <span id="nav-links"></span>
  </div>

  <div class="search-wrap">
    <label for="search">Search:</label>
    <input type="search" id="search" placeholder="title, director, year…" autocomplete="off" spellcheck="false">
    <span id="search-count"></span>
  </div>
  <div id="no-results">No films found.</div>

  <div id="catalog"></div>
</div>

<script>
(function () {
  const PASSWORD = 'shasta';
  const lockScreen = document.getElementById('lock-screen');
  const pageWrap = document.getElementById('page-wrap');
  const passwordInput = document.getElementById('lock-password');
  const submitBtn = document.getElementById('lock-submit');
  const errorMsg = document.getElementById('lock-error');

  function unlock() {
    lockScreen.style.display = 'none';
    pageWrap.style.display = '';
    sessionStorage.setItem('oplopo-unlocked', '1');
  }

  function tryUnlock() {
    if (passwordInput.value === PASSWORD) {
      unlock();
    } else {
      errorMsg.style.display = 'block';
    }
  }

  if (sessionStorage.getItem('oplopo-unlocked') === '1') {
    unlock();
  }

  submitBtn.addEventListener('click', tryUnlock);
  passwordInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tryUnlock();
  });
})();
</script>

const FLAGS = {
  'Brazil':'🇧🇷','China':'🇨🇳','Czech Republic':'🇨🇿','France':'🇫🇷','Germany':'🇩🇪',
  'Hong Kong':'🇭🇰','Hungary':'🇭🇺','Iran':'🇮🇷','Italy':'🇮🇹','Japan':'🇯🇵',
  'Mexico':'🇲🇽','Philippines':'🇵🇭','Poland':'🇵🇱','Portugal':'🇵🇹','Russia':'🇷🇺',
  'Slovakia':'🇸🇰','South Korea':'🇰🇷','Soviet Union':'🇷🇺','Sweden':'🇸🇪',
  'UK':'🇬🇧','USA':'🇺🇸','Director Collections':'🎬','Unsorted':'📂','Watchlist 2025':'★'
};

const catalog  = document.getElementById('catalog');
const navEl    = document.getElementById('nav-links');
const subtitle = document.getElementById('subtitle');
const searchEl = document.getElementById('search');
const countEl  = document.getElementById('search-count');
const noRes    = document.getElementById('no-results');

const total = Object.values(DATA_RAW).reduce((a,b)=>a+b.length,0);
subtitle.textContent = total + ' films across ' + Object.keys(DATA_RAW).length + ' countries / categories';

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildTable(films, dirCol) {
  let rows = '';
  for (const f of films) {
    const dir = dirCol ? '' : (f.director ? esc(f.director) : '');
    rows += '<tr>' +
      '<td class="film-year">' + (f.year||'') + '</td>' +
      '<td class="film-title">' + esc(f.title) + '</td>' +
      (dirCol ? '' : '<td class="film-director">' + dir + '</td>') +
      '</tr>';
  }
  return '<table>' + rows + '</table>';
}

function buildCatalog(data) {
  catalog.innerHTML = '';
  navEl.innerHTML = '';
  let anyVisible = false;

  for (const [country, films] of Object.entries(data)) {
    if (!films.length) continue;
    anyVisible = true;
    const isDir = country === 'Director Collections';
    const id = 'sec-' + country.replace(/[^a-zA-Z0-9]/g,'-');
    const flag = FLAGS[country] || '';

    const sec = document.createElement('div');
    sec.className = 'section';
    sec.id = id;

    let inner = '<div class="section-header">' +
      '<span class="section-country">' + flag + ' ' + esc(country) + '</span>' +
      '<span class="section-count">(' + films.length + ' films)</span>' +
      '</div>';

    if (isDir) {
      const byDir = {};
      for (const f of films) {
        if (!byDir[f.director]) byDir[f.director] = [];
        byDir[f.director].push(f);
      }
      for (const [dir, dfilms] of Object.entries(byDir).sort(([a],[b])=>a.localeCompare(b))) {
        inner += '<div class="director-group">' +
          '<div class="director-name">' + esc(dir) + '</div>' +
          buildTable(dfilms, true) +
          '</div>';
      }
    } else {
      inner += buildTable(films, false);
    }

    sec.innerHTML = inner;
    catalog.appendChild(sec);

    const a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = country;
    navEl.appendChild(a);
    navEl.appendChild(document.createTextNode(' · '));
  }

  noRes.style.display = anyVisible ? 'none' : 'block';
}

let timer;
searchEl.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const q = searchEl.value.trim().toLowerCase();
    if (!q) { countEl.textContent = ''; buildCatalog(DATA_RAW); return; }
    const filtered = {};
    let n = 0;
    for (const [country, films] of Object.entries(DATA_RAW)) {
      const hits = films.filter(f =>
        f.title.toLowerCase().includes(q) ||
        f.director.toLowerCase().includes(q) ||
        f.year.includes(q)
      );
      if (hits.length) { filtered[country] = hits; n += hits.length; }
    }
    countEl.textContent = n ? n + ' result' + (n!==1?'s':'') : '';
    buildCatalog(filtered);
  }, 180);
});

buildCatalog(DATA_RAW);
</script>
